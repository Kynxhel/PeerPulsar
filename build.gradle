plugins {
    id 'net.fabricmc.fabric-loom' version '1.20.0-alpha.22'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
}

dependencies {
    // Minecraft 26.3 (Unobfuscated native, Java 25 bytecode)
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def resolvedModVersion = project.version.toString()
def resolvedArchivesName = project.base.archivesName.get()
def localPropsSource = layout.projectDirectory.file("local.properties").asFile

processResources {
    inputs.property "version", resolvedModVersion
    inputs.property "hasLocalProps", localPropsSource.exists()
    inputs.files(localPropsSource)
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": resolvedModVersion
    }

    doLast {
        def outFile = new File(destinationDir, "assets/fabricp2p/oauth.properties")
        def extracted = new java.util.Properties()
        if (localPropsSource.exists()) {
            def raw = new java.util.Properties()
            localPropsSource.withInputStream { is ->
                raw.load(new java.io.InputStreamReader(is, java.nio.charset.StandardCharsets.UTF_8))
            }
            def clientId = raw.getProperty("google.clientId", "").trim()
            def clientSecret = raw.getProperty("google.clientSecret", "").trim()
            if (!clientId.isEmpty()) {
                extracted.setProperty("google.clientId", clientId)
                if (!clientSecret.isEmpty()) {
                    extracted.setProperty("google.clientSecret", clientSecret)
                }
            }
        }

        if (extracted.containsKey("google.clientId")) {
            outFile.parentFile.mkdirs()
            outFile.withOutputStream { os ->
                extracted.store(os, "FabricP2P Google OAuth Credentials")
            }
        } else if (outFile.exists()) {
            outFile.delete()
        }
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${resolvedArchivesName}" }
    }
}
