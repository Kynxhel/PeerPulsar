name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Inject OAuth properties (if configured in Repo Secrets)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            printf "google.clientId=%s\ngoogle.clientSecret=%s\n" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > local.properties
          fi

      - name: Build Mod with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Clean old releases and publish fresh GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list --json tagName -q '.[].tagName'); do
            gh release delete "$tag" --yes || true
          done
          gh release create "${GITHUB_REF_NAME}" \
            build/libs/fabric-p2p-world-*.jar \
            --title "Fabric P2P World ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
