name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Mod with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MOD_JAR=$(find build/libs -maxdepth 1 -name 'peerpulsar-*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$MOD_JAR" ]; then
            echo "Built mod JAR not found!" >&2
            exit 1
          fi
          awk -v tag="${GITHUB_REF_NAME}" '
            { sub(/\r$/, "") }
            $0 == "## " tag { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            cp CHANGELOG.md release_notes.md
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "PeerPulsar ${GITHUB_REF_NAME}" \
              --notes-file release_notes.md
            gh release upload "${GITHUB_REF_NAME}" "$MOD_JAR" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "$MOD_JAR" \
              --title "PeerPulsar ${GITHUB_REF_NAME}" \
              --notes-file release_notes.md
          fi
